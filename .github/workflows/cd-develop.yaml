name: wf-cd-develop
on:
  push:
    branches:
      - develop
jobs:
  cd-build-develop-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
      - name: Build Website With Parcel
        run: npx parcel build "./src/index.html" --dist-dir "./dist" --public-url "./"
      - name: Upload Build Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"
          name: "build-artifact-develop"
  cd-deploye-develop-job:
    needs: "cd-build-develop-job"
    permissions:
      pages: write
      id-token: write
    environment:
      name: env-develop
    runs-on: ubuntu-latest
    steps:
      - name: Deploy the Build Artifact on GH Pages
        uses: actions/deploy-pages@v4
        with:
          artifact_name: "build-artifact-develop"
          token: "${{github.token}}"