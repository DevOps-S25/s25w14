name: wf-cd-prod
on:
  push:
    branches:
      - production
jobs:
  cd-build-prod-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          ref: "${{github.ref}}"
      - name: Build For Production
        run: npx parcel build "./src/index.html" --dist-dir "./dist" --public-url "./"
      - name: Upload Build Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"
          name: "build-artifact-prod"
  cd-deploy-prod-job:
    needs: cd-build-prod-job
    permissions:
      pages: write
      id-token: write
    environment:
      name: env-production
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Pages Artifact
        uses: actions/deploy-pages
        with:
          artifact_name: "build-artifact-prod"
          token: "${{github.token}}"

